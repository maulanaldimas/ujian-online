x-db-env: &db-env
  POSTGRES_DB: ujian_rekrutmen
  POSTGRES_USER: ujian
  POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

services:
  ujian-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ujian -d ujian_rekrutmen"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portfolio-net

  ujian:
    build:
      context: .
      args:
        APP_BASE_PATH: /ujian
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ujian:${DB_PASSWORD}@ujian-db:5432/ujian_rekrutmen
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      NODE_ENV: production
      APP_BASE_PATH: /ujian
      NEXT_PUBLIC_APP_BASE_PATH: /ujian
    ports:
      - "3001:3000"
    depends_on:
      ujian-db:
        condition: service_healthy
    networks:
      - portfolio-net

volumes:
  pg_data:

networks:
  portfolio-net:
    external: true
