x-db-env: &db-env
  POSTGRES_DB: ujian_rekrutmen
  POSTGRES_USER: ujian
  POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ujian -d ujian_rekrutmen"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ujian:${DB_PASSWORD}@db:5432/ujian_rekrutmen
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
