name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "file:./ci-test.db"
          JWT_SECRET: "ci-test-secret-key"

  docker:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ujian-online .

      - name: Test Docker image
        run: |
          docker run -d --name test-db \
            -e POSTGRES_DB=ujian_rekrutmen \
            -e POSTGRES_USER=ujian \
            -e POSTGRES_PASSWORD=testpass \
            -p 5432:5432 \
            postgres:16-alpine
          sleep 5
          docker run --rm \
            --link test-db:db \
            -p 3000:3000 \
            -e DATABASE_URL=postgresql://ujian:testpass@db:5432/ujian_rekrutmen \
            -e JWT_SECRET=test-secret \
            ujian-online &
          sleep 10
          curl -f http://localhost:3000/api/auth/me || exit 1
          docker rm -f test-db
          docker rm -f $(docker ps -aq --filter ancestor=ujian-online) || true
